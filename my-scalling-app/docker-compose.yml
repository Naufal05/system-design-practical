# docker-compose.yml
# Orchestrates the servers and the load balancer together
version: "3.8"

services:
  app-node-1:
    build: .
    environment:
      - PORT=3000
      - INSTANCE_NAME=Server-Alpha

  app-node-2:
    build: .
    environment:
      - PORT=3000
      - INSTANCE_NAME=Server-Bravo

  app-node-3:
    build: .
    environment:
      - PORT=3000
      - INSTANCE_NAME=Server-Charlie

  load-balancer:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app-node-1
      - app-node-2
      - app-node-3
